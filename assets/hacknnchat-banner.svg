<svg width="100%" viewBox="0 0 860 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      .mono { font-family: 'Share Tech Mono', 'Courier New', monospace; }

      .grid { animation: fadeIn 1.2s ease forwards; opacity:0; }
      @keyframes fadeIn { to { opacity:1; } }

      .scan { animation: scanMove 4s linear infinite; }
      @keyframes scanMove {
        0%   { transform: translateY(-200px); }
        100% { transform: translateY(200px); }
      }

      .arc1 { animation: spin1 9s linear infinite; transform-origin: 138px 100px; }
      .arc2 { animation: spin2 14s linear infinite; transform-origin: 138px 100px; }
      @keyframes spin1 { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      @keyframes spin2 { from{transform:rotate(0deg)} to{transform:rotate(-360deg)} }

      .ring { animation: ringPulse 3s ease-in-out 2s infinite; }
      @keyframes ringPulse {
        0%,100%{opacity:0.3;} 50%{opacity:0.7;}
      }
      .ping { animation: pingOut 2.8s ease-out 2.5s infinite; }
      @keyframes pingOut {
        0%{r:5;opacity:1} 100%{r:26;opacity:0}
      }

      .brk { stroke-dasharray:80; stroke-dashoffset:80; animation: drawBrk 0.5s ease forwards; }
      .brk1{animation-delay:0.3s;} .brk2{animation-delay:0.5s;} .brk3{animation-delay:0.7s;} .brk4{animation-delay:0.9s;}
      @keyframes drawBrk { to { stroke-dashoffset:0; } }

      .tH  { animation: dropIn 0.5s cubic-bezier(.2,1.4,.4,1) 1.1s both; }
      .ta  { animation: dropIn 0.5s cubic-bezier(.2,1.4,.4,1) 1.2s both; }
      .tc  { animation: dropIn 0.5s cubic-bezier(.2,1.4,.4,1) 1.3s both; }
      .tk  { animation: dropIn 0.5s cubic-bezier(.2,1.4,.4,1) 1.4s both; }
      .tN  { animation: dropIn 0.5s cubic-bezier(.2,1.4,.4,1) 1.55s both; }
      .tC2 { animation: dropIn 0.5s cubic-bezier(.2,1.4,.4,1) 1.7s both; }
      .th2 { animation: dropIn 0.5s cubic-bezier(.2,1.4,.4,1) 1.8s both; }
      .ta2 { animation: dropIn 0.5s cubic-bezier(.2,1.4,.4,1) 1.9s both; }
      .tt  { animation: dropIn 0.5s cubic-bezier(.2,1.4,.4,1) 2.0s both; }
      @keyframes dropIn {
        from { opacity:0; transform:translateY(-14px); }
        to   { opacity:1; transform:translateY(0); }
      }

      .tag  { animation: fadeUp 0.5s ease 2.6s both; }
      .tag2 { animation: fadeUp 0.5s ease 2.9s both; }
      @keyframes fadeUp {
        from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)}
      }

      .dot { animation: blink 1.6s step-start infinite; opacity:0; }
      .dot1{animation-delay:3.1s;} .dot2{animation-delay:3.35s;} .dot3{animation-delay:3.6s;}
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.15} }

      .dline { stroke-dasharray:220; stroke-dashoffset:220; animation: drawLine 0.9s ease forwards; }
      .dl1{animation-delay:0.5s;} .dl2{animation-delay:0.7s;} .dl3{animation-delay:0.9s;}
      @keyframes drawLine { to{ stroke-dashoffset:0; } }

      .vbar { animation: vPulse 2.2s ease-in-out infinite; }
      @keyframes vPulse {
        0%,100%{height:10px;y:95px;opacity:0.35} 50%{height:44px;y:78px;opacity:0.9}
      }

      .boot { animation: fadeUp 0.4s ease both; }
      .b1{animation-delay:1.3s;} .b2{animation-delay:1.6s;} .b3{animation-delay:1.9s;} .b4{animation-delay:2.2s;}

      .node-blink { animation: nodeBlink 2s ease-in-out infinite; }
      @keyframes nodeBlink { 0%,100%{opacity:0.4} 50%{opacity:1} }

      .ul { animation: wipeR 0.7s ease 2.2s both; }
      @keyframes wipeR {
        from{width:0} to{width:418px}
      }
    </style>
    <clipPath id="mc"><rect x="0" y="0" width="860" height="200"/></clipPath>
  </defs>

  <rect width="860" height="200" fill="#060d1a"/>

  <!-- Grid -->
  <g class="grid" opacity="0.055">
    <line x1="0" y1="40"  x2="860" y2="40"  stroke="#4fa3ff" stroke-width="0.5"/>
    <line x1="0" y1="80"  x2="860" y2="80"  stroke="#4fa3ff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="860" y2="120" stroke="#4fa3ff" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="860" y2="160" stroke="#4fa3ff" stroke-width="0.5"/>
    <line x1="86"  y1="0" x2="86"  y2="200" stroke="#4fa3ff" stroke-width="0.5"/>
    <line x1="172" y1="0" x2="172" y2="200" stroke="#4fa3ff" stroke-width="0.5"/>
    <line x1="258" y1="0" x2="258" y2="200" stroke="#4fa3ff" stroke-width="0.5"/>
    <line x1="344" y1="0" x2="344" y2="200" stroke="#4fa3ff" stroke-width="0.5"/>
    <line x1="430" y1="0" x2="430" y2="200" stroke="#4fa3ff" stroke-width="0.5"/>
    <line x1="516" y1="0" x2="516" y2="200" stroke="#4fa3ff" stroke-width="0.5"/>
    <line x1="602" y1="0" x2="602" y2="200" stroke="#4fa3ff" stroke-width="0.5"/>
    <line x1="688" y1="0" x2="688" y2="200" stroke="#4fa3ff" stroke-width="0.5"/>
    <line x1="774" y1="0" x2="774" y2="200" stroke="#4fa3ff" stroke-width="0.5"/>
  </g>

  <!-- Scanline -->
  <g clip-path="url(#mc)">
    <rect class="scan" x="0" y="0" width="860" height="4" fill="#58a6ff" opacity="0.045"/>
  </g>

  <!-- ===== LEFT: Ring System ===== -->
  <g class="arc1">
    <circle cx="138" cy="100" r="62" fill="none" stroke="#58a6ff" stroke-width="0.8" stroke-dasharray="14 7" opacity="0.22"/>
  </g>
  <g class="arc2">
    <circle cx="138" cy="100" r="48" fill="none" stroke="#79c0ff" stroke-width="0.6" stroke-dasharray="4 12" opacity="0.3"/>
  </g>
  <circle class="ring" cx="138" cy="100" r="46" fill="none" stroke="#58a6ff" stroke-width="1.4"/>
  <circle cx="138" cy="100" r="32" fill="none" stroke="#58a6ff" stroke-width="0.5" opacity="0.45"/>
  <circle cx="138" cy="100" r="6"  fill="#58a6ff" opacity="0.95"/>
  <circle class="ping" cx="138" cy="100" fill="none" stroke="#58a6ff" stroke-width="1.2"/>

  <!-- Crosshairs -->
  <line x1="138" y1="62"  x2="138" y2="74"  stroke="#58a6ff" stroke-width="0.8" opacity="0.45"/>
  <line x1="138" y1="126" x2="138" y2="138" stroke="#58a6ff" stroke-width="0.8" opacity="0.45"/>
  <line x1="96"  y1="100" x2="110" y2="100" stroke="#58a6ff" stroke-width="0.8" opacity="0.45"/>
  <line x1="166" y1="100" x2="180" y2="100" stroke="#58a6ff" stroke-width="0.8" opacity="0.45"/>

  <!-- Data lines ring → title -->
  <line class="dline dl1" x1="188" y1="100" x2="260" y2="100" stroke="#58a6ff" stroke-width="0.8" opacity="0.28"/>
  <line class="dline dl2" x1="188" y1="88"  x2="245" y2="88"  stroke="#58a6ff" stroke-width="0.5" opacity="0.18"/>
  <line class="dline dl3" x1="188" y1="112" x2="245" y2="112" stroke="#58a6ff" stroke-width="0.5" opacity="0.18"/>

  <!-- Left edge pulse bar -->
  <rect class="vbar" x="14" y="95" width="3" rx="1" fill="#58a6ff"/>

  <!-- Boot log -->
  <text class="mono boot b1" x="22" y="50"  font-size="8" fill="#58a6ff" opacity="0.45">SYS_BOOT   v3.1.0</text>
  <text class="mono boot b2" x="22" y="90"  font-size="8" fill="#58a6ff" opacity="0.45">INIT_CONN  OK</text>
  <text class="mono boot b3" x="22" y="112" font-size="8" fill="#58a6ff" opacity="0.45">AUTH_NODE  PASS</text>
  <text class="mono boot b4" x="22" y="152" font-size="8" fill="#58a6ff" opacity="0.45">NET_STATUS ONLINE</text>

  <!-- Node squares -->
  <rect class="node-blink" x="232" y="83" width="8" height="8" rx="1" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.5"/>
  <rect class="node-blink" x="232" y="109" width="8" height="8" rx="1" fill="none" stroke="#79c0ff" stroke-width="1" opacity="0.4" style="animation-delay:1s"/>

  <!-- ===== RIGHT: Title ===== -->
  <!-- Corner brackets -->
  <polyline class="brk brk1" points="268,22 248,22 248,44"   fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.8"/>
  <polyline class="brk brk2" points="848,22 868,22 868,44"   fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.8"/>
  <polyline class="brk brk3" points="268,178 248,178 248,156" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.8"/>
  <polyline class="brk brk4" points="848,178 868,178 868,156" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.8"/>

  <!-- HackNChat — each character drops in individually -->
  <text class="mono tH"  x="270" y="118" font-size="76" font-weight="bold" fill="#e6f1ff" style="font-family:'Share Tech Mono','Courier New',monospace">H</text>
  <text class="mono ta"  x="323" y="118" font-size="76" font-weight="bold" fill="#cae8ff" style="font-family:'Share Tech Mono','Courier New',monospace">a</text>
  <text class="mono tc"  x="371" y="118" font-size="76" font-weight="bold" fill="#cae8ff" style="font-family:'Share Tech Mono','Courier New',monospace">c</text>
  <text class="mono tk"  x="414" y="118" font-size="76" font-weight="bold" fill="#cae8ff" style="font-family:'Share Tech Mono','Courier New',monospace">k</text>
  <!-- N accent -->
  <text class="mono tN"  x="462" y="118" font-size="76" font-weight="bold" fill="#58a6ff" style="font-family:'Share Tech Mono','Courier New',monospace">N</text>
  <!-- Chat -->
  <text class="mono tC2" x="514" y="118" font-size="76" font-weight="bold" fill="#cae8ff" style="font-family:'Share Tech Mono','Courier New',monospace">C</text>
  <text class="mono th2" x="563" y="118" font-size="76" font-weight="bold" fill="#cae8ff" style="font-family:'Share Tech Mono','Courier New',monospace">h</text>
  <text class="mono ta2" x="611" y="118" font-size="76" font-weight="bold" fill="#cae8ff" style="font-family:'Share Tech Mono','Courier New',monospace">a</text>
  <text class="mono tt"  x="657" y="118" font-size="76" font-weight="bold" fill="#e6f1ff" style="font-family:'Share Tech Mono','Courier New',monospace">t</text>

  <!-- Animated underline -->
  <rect class="ul" x="270" y="126" height="2" rx="1" fill="#58a6ff" opacity="0.7" width="0"/>

  <!-- Tagline -->
  <text class="mono tag" x="270" y="152" font-size="11" fill="#79c0ff" opacity="0.65" letter-spacing="4"
    style="font-family:'Share Tech Mono','Courier New',monospace">HACK . CONNECT . BUILD</text>

  <!-- Status dots -->
  <circle class="dot dot1" cx="270" cy="170" r="4" fill="#58a6ff"/>
  <circle class="dot dot2" cx="286" cy="170" r="4" fill="#58a6ff"/>
  <circle class="dot dot3" cx="302" cy="170" r="4" fill="#58a6ff"/>
  <text class="mono tag2" x="316" y="174" font-size="9" fill="#58a6ff" opacity="0.45" letter-spacing="2"
    style="font-family:'Share Tech Mono','Courier New',monospace">SYSTEM ACTIVE</text>

  <!-- Right edge pulse bar -->
  <rect x="856" y="80" width="3" rx="1" fill="#58a6ff" opacity="0.35">
    <animate attributeName="height" values="14;44;14" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="y"      values="86;69;86" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
